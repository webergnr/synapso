<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <title>Synapso — mark B, the S as one continuous connector curve</title>
  <!-- Two tangent ellipses (rx14 ry10) centred at 32,22 and 32,42: the join at
       32,32 is horizontal on both, so the curve is smooth through the middle. -->
