        stroke="var(--ink, #4FD08A)" stroke-width="4"/>
  <path d="M15.6 44.4 L24.42 45.81 L19.78 52.33 Z" fill="var(--tip, #56C8D8)" stroke="none"/>
  <g fill="var(--bg, #131418)" stroke="var(--ink, #4FD08A)" stroke-width="2.5">
    <rect x="36.4" y="9.43" width="11" height="11"/>
    <rect x="12.5" y="16.5" width="11" height="11"/>
    <rect x="40.5" y="36.5" width="11" height="11"/>
  </g>
</svg>
