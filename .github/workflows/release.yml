name: release

# Every push to main that touches the app PUBLISHES a release: Windows x64 and
# macOS arm64, built and tested here, under the next version (see the version
# job). Pushes that only touch the website or the docs do not release.
#
# The "Run workflow" button, and a pull request that changes this file or the
# macOS recipe, do the same builds WITHOUT publishing anything: the .zip files
# stay as run artifacts, which is how this workflow is tested.
#
# Hosted runners, macOS included, are free on a public repository.
on:
  push:
    branches: [main]
    paths-ignore:
      - "website/**"
      - "docs/**"
      - "**.md"
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "tools/release-macos.sh"
  workflow_dispatch:

# one release at a time: a second push waits, then sees the first one's tag
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The next version: the last vX.Y.Z tag with the patch bumped, or the
  # version in Cargo.toml when that is higher. Raising Cargo.toml (0.2.0, say)
  # is how a release skips ahead; otherwise every release is +0.0.1.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: next
        run: |
          set -euo pipefail
          last=$(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/v##' \
            | { grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -1)
          last=${last:-0.0.0}
          IFS=. read -r major minor patch <<<"$last"
          bumped="$major.$minor.$((patch + 1))"
          cargo=$(sed -n 's/^version = "\([0-9.]*\)"$/\1/p' Cargo.toml | head -1)
          next=$(printf '%s\n%s\n' "$bumped" "$cargo" | sort -V | tail -1)
          echo "last tag v$last, Cargo.toml $cargo -> v$next"
          echo "version=$next" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    # GitHub's default shell on Windows is `pwsh`; `powershell` is the 5.1 that
    # ships with the OS, which the steps below were written for
    defaults:
      run:
        shell: powershell
    env:
      ZIP: synapso-windows-x86_64.zip
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # ⚠️ same as ci.yml: `actions-rust-lang/setup-rust-toolchain` is bash
      # inside, so the toolchain is set up by hand
      - name: rust toolchain
        run: |
          if (-not (Get-Command cargo -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest https://win.rustup.rs/x86_64 -OutFile rustup-init.exe
            ./rustup-init.exe -y --default-toolchain stable --profile minimal
            # ⚠️ not Out-File: PowerShell 5.1 writes it with a BOM, and the
            # runner reads the first line of $GITHUB_PATH with the BOM in it
            Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.cargo\bin"
            $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
          }
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version; cargo --version

      # the exe's FileVersion comes from Cargo.toml, so it gets the release's
      # version; Cargo.lock too, or --locked refuses to build. Not committed.
      - name: stamp the version
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          sed -i '0,/^version = ".*"$/s//version = "'"$VERSION"'"/' Cargo.toml
          sed -i '/^name = "synapso"$/{n;s/^version = ".*"$/version = "'"$VERSION"'"/}' Cargo.lock
          grep -m1 '^version = ' Cargo.toml
          grep -A1 '^name = "synapso"$' Cargo.lock

      - run: cargo test --workspace --release --locked
      - run: cargo build --release --locked

      - run: Compress-Archive -Force target\release\synapso.exe $env:ZIP

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.ZIP }}
          path: ${{ env.ZIP }}

  macos:
    needs: version
    # macos-latest is arm64, which is what the .zip name promises (the recipe
    # checks it with lipo)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version; cargo --version
      # tests, builds, bundles, signs ad hoc and zips: the same recipe a Mac
      # runs by hand
      - run: tools/release-macos.sh "v${{ needs.version.outputs.version }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synapso-macos-arm64.zip
          path: synapso-macos-arm64.zip

  publish:
    needs: [version, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - run: |
          ls -l dist
          test -f dist/synapso-windows-x86_64.zip
          test -f dist/synapso-macos-arm64.zip
      # only a push to main publishes; a pull request or "Run workflow" stops
      # at the artifacts above. Tag and release are created together, on the
      # commit that was built, and the release goes out with both files on it.
      - name: publish v${{ needs.version.outputs.version }}
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
          NOTES: |
            Neither binary is signed.

            - **macOS**: Gatekeeper blocks the first launch. Try to open it once, then
              System Settings -> Privacy & Security -> Open Anyway (right-click -> Open
              on macOS 14 and older), or `xattr -dr com.apple.quarantine Synapso.app`.
            - **Windows**: SmartScreen warns. More info -> Run anyway.
        run: |
          gh release create "$TAG" dist/*.zip --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "$TAG" --notes "$NOTES" --generate-notes
